<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Combat Simulator v10 — Battle Test</title>
<style>
:root {
    --bg: #0f1218; --panel: #1a1f2b; --border: #2a3142;
    --text: #e6e8ee; --muted: #8a93a6; --accent: #ffcf3f;
    --s: #ff5e7a; --r: #6aa7ff; --p: #58e58a;
    --ok: #4ade80; --warn: #ff6b35; --bad: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    line-height: 1.5; min-height: 100vh; }
header { background: linear-gradient(135deg, #1a1f2b 0%, #0f1218 100%);
    border-bottom: 2px solid var(--accent); padding: 20px 28px; }
header h1 { font-size: 22px; } header h1 span { color: var(--accent); }
header p { color: var(--muted); font-size: 12px; margin-top: 4px; }
main { max-width: 1000px; margin: 0 auto; padding: 20px 28px 40px; }
.section { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 18px 22px; margin-bottom: 16px; }
.section h2 { color: var(--accent); font-size: 14px; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 14px; }
.row { display: flex; gap: 20px; flex-wrap: wrap; }
.col { flex: 1; min-width: 200px; }
label { display: block; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
select, input { width: 100%; background: #0f1218; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; font-size: 13px; font-family: inherit; }
select:focus, input:focus { outline: none; border-color: var(--accent); }
.btn { display: inline-block; background: var(--accent); color: #0f1218;
    border: none; border-radius: 4px; padding: 10px 28px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: 1px; margin-top: 12px; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.stat-preview { background: #0f1218; border: 1px solid var(--border);
    border-radius: 4px; padding: 10px 14px; margin-top: 8px; font-size: 12px; }
.stat-preview .row { display: flex; gap: 12px; }
.stat-preview .item { min-width: 60px; }
.stat-preview .item .val { font-size: 16px; font-weight: 700; }
.result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.result-card { background: #0f1218; border: 1px solid var(--border);
    border-radius: 6px; padding: 14px 16px; text-align: center; }
.result-card .label { font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; }
.result-card .value { font-size: 24px; font-weight: 700; margin-top: 6px; }
.result-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 700; margin-left: 6px; }
.badge.s { background: rgba(255,94,122,0.2); color: var(--s); }
.badge.r { background: rgba(106,167,255,0.2); color: var(--r); }
.badge.p { background: rgba(88,229,138,0.2); color: var(--p); }
.detail-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
.detail-table th, .detail-table td { padding: 4px 8px; text-align: center;
    border-bottom: 1px solid var(--border); }
.detail-table th { background: #0f1218; color: var(--muted);
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
#progress { color: var(--muted); font-size: 11px; margin-top: 8px; }
.counter-hint { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>
<header>
    <h1>⚔️ Combat Simulator <span>v10</span> — Battle Test</h1>
    <p>Mô phỏng trận đấu ngẫu nhiên • Không build system • Cân bằng 100%</p>
</header>

<main>

<!-- ── CONFIG ── -->
<section class="section">
    <h2>① Cấu hình trận đấu</h2>
    <div class="row">
        <div class="col">
            <label>Pet A <span class="badge s">🐾</span></label>
            <select id="pet-a-el">
                <option value="SCISSORS">✂️ Hệ Kéo</option>
                <option value="ROCK">🔨 Hệ Búa</option>
                <option value="PAPER" selected>📄 Hệ Bao</option>
            </select>
        </div>
        <div class="col">
            <label>Pet B <span class="badge r">🐾</span></label>
            <select id="pet-b-el">
                <option value="SCISSORS">✂️ Hệ Kéo</option>
                <option value="ROCK" selected>🔨 Hệ Búa</option>
                <option value="PAPER">📄 Hệ Bao</option>
            </select>
        </div>
    </div>
    <div class="row" style="margin-top:12px;">
        <div class="col">
            <label>Level Pet A</label>
            <input type="number" id="pet-a-lv" value="40" min="1" max="40" step="1">
        </div>
        <div class="col">
            <label>Level Pet B</label>
            <input type="number" id="pet-b-lv" value="40" min="1" max="40" step="1">
        </div>
    </div>
    <div class="row" style="margin-top:12px;">
        <div class="col">
            <label>Số trận giả lập (N)</label>
            <input type="number" id="sim-n" value="500" min="10" max="10000" step="10">
        </div>
        <div class="col" style="display:flex;align-items:flex-end;">
            <button class="btn" id="btn-run" onclick="runTest()">▶ Chạy mô phỏng</button>
        </div>
    </div>
    <div id="progress"></div>
</section>

<!-- ── STAT PREVIEW ── -->
<section class="section">
    <h2>② Chỉ số pet</h2>
    <div class="row">
        <div class="col"><div class="stat-preview" id="stat-a"></div></div>
        <div class="col"><div class="stat-preview" id="stat-b"></div></div>
    </div>
</section>

<!-- ── RESULTS ── -->
<section class="section" id="sec-res" style="display:none;">
    <h2>③ Kết quả mô phỏng</h2>
    <div class="result-grid" id="result-grid"></div>
    <div id="detail-table"></div>
</section>

</main>

<script>
// ════════════════════════════════════════════
//  EMBEDDED ENGINE (từ simulator_v10.js)
// ════════════════════════════════════════════
'use strict';

const MS = [1,5,10,15,20,25,30,35,40];

function drRate(def) {
    if (def <= 0) return 0;
    return Math.max(0, Math.min(0.95, 1 - Math.pow(0.98, Math.pow(def, 0.8))));
}
function passiveChance(luck) {
    if (luck <= 0) return 0;
    return Math.max(0, Math.min(0.90, 1 - Math.pow(0.99, Math.pow(luck, 0.75))));
}
function rawDmg(atk, def) { return atk * (1 - drRate(def)); }
function intDmg(d) { return Math.max(0, Math.floor(d)); }

const STATS_CFG = {
    SCISSORS: {
        base: { hp: 90, atk: 18, def: 2, luck: 7 },
        growth: {
            hp: [10, 14, 10, 18],
            atk: [1.5, 2.0, 1.0, 1.4],
            def: [0.10, 0.15, 0.10, 0.15],
            luck: [0.7, 0.9, 0.5, 0.7]
        }
    },
    ROCK: {
        base: { hp: 110, atk: 13, def: 7, luck: 4 },
        growth: {
            hp: [12, 16, 24, 20],
            atk: [0.9, 1.2, 1.4, 1.1],
            def: [0.5, 0.6, 1.1, 0.6],
            luck: [0.25, 0.25, 0.35, 0.25]
        }
    },
    PAPER: {
        base: { hp: 100, atk: 14, def: 4, luck: 6 },
        growth: {
            hp: [14, 18, 14, 22],
            atk: [1.1, 1.3, 1.0, 1.1],
            def: [0.2, 0.25, 0.2, 0.25],
            luck: [0.7, 0.5, 0.4, 0.5]
        }
    }
};

function phaseIdx(lv) {
    if (lv <= 10) return 0;
    if (lv <= 20) return 1;
    if (lv <= 30) return 2;
    return 3;
}

function statsAtLv(el, lv) {
    const c = STATS_CFG[el];
    let hp = c.base.hp, atk = c.base.atk, def = c.base.def, luck = c.base.luck;
    for (let l = 2; l <= lv; l++) {
        const p = phaseIdx(l);
        hp += c.growth.hp[p]; atk += c.growth.atk[p];
        def += c.growth.def[p]; luck += c.growth.luck[p];
    }
    return { element: el, level: lv,
        hp: Math.round(hp * 10) / 10, maxHp: Math.round(hp * 10) / 10,
        atk: Math.round(atk * 10) / 10, def: Math.round(def * 10) / 10,
        luck: Math.round(luck * 10) / 10 };
}

const PASSIVE = {
    scissorsCritLow:  {1:1.10,5:1.12,10:1.14,15:1.17,20:1.20,25:1.22,30:1.24,35:1.245,40:1.25},
    scissorsCritHigh: {1:1.20,5:1.25,10:1.30,15:1.35,20:1.40,25:1.43,30:1.46,35:1.48,40:1.50},
    rockGuardBase:    {1:0.10,5:0.13,10:0.16,15:0.19,20:0.22,25:0.25,30:0.27,35:0.29,40:0.30},
    rockGuardLowHp:   {1:0.20,5:0.27,10:0.34,15:0.40,20:0.46,25:0.50,30:0.54,35:0.57,40:0.60},
    paperHealBase:    {1:0.20,5:0.23,10:0.26,15:0.29,20:0.32,25:0.35,30:0.37,35:0.39,40:0.40},
    paperHealLowHp:   {1:0.40,5:0.48,10:0.56,15:0.62,20:0.68,25:0.72,30:0.75,35:0.78,40:0.80}
};

const COUNTER = {
    rock_vs_scissors_def:  {1:1,5:5,10:11.5,15:17.5,20:24.7,25:24.7,30:24.7,35:24.7,40:24.7},
    rock_vs_scissors_hp:   {1:5,5:12,10:24,15:39,20:54,25:54,30:54,35:54,40:54},
    scissors_vs_paper_atk: {1:0.5,5:1.4,10:5.8,15:11.1,20:13.8,25:20.3,30:31.9,35:31.9,40:31.9},
    scissors_vs_paper_luck:{1:1,5:2,10:7.4,15:10.8,20:10.8,25:17.3,30:24.8,35:24.8,40:24.8},
    paper_vs_rock_hp:      {1:5,5:15,10:15,15:15,20:15,25:156,30:323,35:323,40:323},
    paper_vs_rock_luck:    {1:1,5:2,10:2,15:2,20:2,25:20,30:39.2,35:39.2,40:39.2}
};

const MIRROR = {
    scissors_dmg_mult: {1:0.87,5:0.86,10:0.765,15:0.765,20:0.705,25:0.685,30:0.665,35:0.665,40:0.655},
    rock_def_mult:     {1:0.01,5:0.235,10:0.29,15:0.385,20:0.41,25:0.35,30:0.305,35:0.42,40:0.555},
    paper_all_mult:    {1:0.40,5:0.395,10:0.395,15:0.415,20:0.46,25:0.49,30:0.52,35:0.56,40:0.60}
};

function lutAt(table, lv) {
    const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
    if (lv <= keys[0]) return table[keys[0]];
    if (lv >= keys[keys.length-1]) return table[keys[keys.length-1]];
    for (let i=0; i<keys.length-1; i++) {
        if (lv >= keys[i] && lv <= keys[i+1]) {
            const t = (lv-keys[i])/(keys[i+1]-keys[i]);
            return table[keys[i]] + (table[keys[i+1]]-table[keys[i]]) * t;
        }
    }
    return table[keys[keys.length-1]];
}

function prepareFight(a, b) {
    const A = { ...a, maxHp: a.hp, dmgMult: 1 };
    const B = { ...b, maxHp: b.hp, dmgMult: 1 };

    // --- COUNTER ---
    if (A.element === 'ROCK' && B.element === 'SCISSORS') {
        A.def += lutAt(COUNTER.rock_vs_scissors_def, A.level);
        A.maxHp += lutAt(COUNTER.rock_vs_scissors_hp, A.level);
        A.hp += lutAt(COUNTER.rock_vs_scissors_hp, A.level);
    } else if (B.element === 'ROCK' && A.element === 'SCISSORS') {
        B.def += lutAt(COUNTER.rock_vs_scissors_def, B.level);
        B.maxHp += lutAt(COUNTER.rock_vs_scissors_hp, B.level);
        B.hp += lutAt(COUNTER.rock_vs_scissors_hp, B.level);
    } else if (A.element === 'SCISSORS' && B.element === 'PAPER') {
        A.atk += lutAt(COUNTER.scissors_vs_paper_atk, A.level);
        A.luck += lutAt(COUNTER.scissors_vs_paper_luck, A.level);
    } else if (B.element === 'SCISSORS' && A.element === 'PAPER') {
        B.atk += lutAt(COUNTER.scissors_vs_paper_atk, B.level);
        B.luck += lutAt(COUNTER.scissors_vs_paper_luck, B.level);
    } else if (A.element === 'PAPER' && B.element === 'ROCK') {
        A.maxHp += lutAt(COUNTER.paper_vs_rock_hp, A.level);
        A.hp += lutAt(COUNTER.paper_vs_rock_hp, A.level);
        A.luck += lutAt(COUNTER.paper_vs_rock_luck, A.level);
    } else if (B.element === 'PAPER' && A.element === 'ROCK') {
        B.maxHp += lutAt(COUNTER.paper_vs_rock_hp, B.level);
        B.hp += lutAt(COUNTER.paper_vs_rock_hp, B.level);
        B.luck += lutAt(COUNTER.paper_vs_rock_luck, B.level);
    }

    // --- MIRROR ---
    if (A.element === B.element) {
        if (A.element === 'SCISSORS') {
            const m = lutAt(MIRROR.scissors_dmg_mult, A.level);
            A.dmgMult *= m; B.dmgMult *= m;
        } else if (A.element === 'ROCK') {
            const m = lutAt(MIRROR.rock_def_mult, A.level);
            A.def *= m; B.def *= m;
        } else if (A.element === 'PAPER') {
            const m = lutAt(MIRROR.paper_all_mult, A.level);
            A.hp *= m; A.maxHp *= m; A.atk *= m; A.def *= m; A.luck *= m;
            B.hp *= m; B.maxHp *= m; B.atk *= m; B.def *= m; B.luck *= m;
        }
    }
    return { A, B };
}

function attackOnce(attacker, defender) {
    let dmg = rawDmg(attacker.atk, defender.def);

    if (attacker.element === 'SCISSORS') {
        if (Math.random() < passiveChance(attacker.luck)) {
            const isHigh = (attacker.hp / attacker.maxHp) > 0.75;
            const mult = isHigh ? lutAt(PASSIVE.scissorsCritHigh, attacker.level) : lutAt(PASSIVE.scissorsCritLow, attacker.level);
            dmg *= mult;
        }
    }
    if (attacker.dmgMult && attacker.dmgMult !== 1) dmg *= attacker.dmgMult;

    if (defender.element === 'ROCK') {
        if (Math.random() < passiveChance(defender.luck)) {
            const isLow = (defender.hp / defender.maxHp) < 0.30;
            const r = isLow ? lutAt(PASSIVE.rockGuardLowHp, defender.level) : lutAt(PASSIVE.rockGuardBase, defender.level);
            dmg *= (1 - r);
        }
    }
    const dealt = intDmg(dmg);
    defender.hp = Math.max(0, defender.hp - dealt);

    if (defender.element === 'PAPER' && defender.hp > 0 && dealt > 0) {
        if (Math.random() < passiveChance(defender.luck)) {
            const isLow = (defender.hp / defender.maxHp) < 0.25;
            const rate = isLow ? lutAt(PASSIVE.paperHealLowHp, defender.level) : lutAt(PASSIVE.paperHealBase, defender.level);
            const heal = Math.max(1, Math.floor(dealt * rate));
            defender.hp = Math.min(defender.maxHp, defender.hp + heal);
        }
    }
}

// Fixed simulateBattle — xử lý đúng goFirst và HP ratio
function simulateBattle(sa, sb, goFirst) {
    const maxTurns = 100;
    const first  = goFirst === 'B' ? sb : sa;
    const second = goFirst === 'B' ? sa : sb;
    const prep = prepareFight(first, second);
    const atk1 = prep.A, atk2 = prep.B;

    // Track original objects for winner HP
    const aObj = goFirst === 'B' ? atk2 : atk1;
    const bObj = goFirst === 'B' ? atk1 : atk2;

    let turns = 0;
    while (turns < maxTurns && atk1.hp > 0 && atk2.hp > 0) {
        turns++;
        attackOnce(atk1, atk2);
        if (atk2.hp <= 0) break;
        attackOnce(atk2, atk1);
    }

    let winner;
    if (atk1.hp > 0 && atk2.hp <= 0) winner = goFirst === 'B' ? 'B' : 'A';
    else if (atk2.hp > 0 && atk1.hp <= 0) winner = goFirst === 'B' ? 'A' : 'B';
    else if (atk1.hp > atk2.hp) winner = goFirst === 'B' ? 'B' : 'A';
    else if (atk2.hp > atk1.hp) winner = goFirst === 'B' ? 'A' : 'B';
    else winner = 'DRAW';

    const wObj = winner === 'A' ? aObj : (winner === 'B' ? bObj : null);
    const winnerHpRatio = wObj ? wObj.hp / wObj.maxHp : 0;

    return { winner, turns, winnerHpRatio };
}

// ════════════════════════════════════════════
//  UI LOGIC
// ════════════════════════════════════════════

const EL_COLOR = {SCISSORS:'#ff5e7a',ROCK:'#6aa7ff',PAPER:'#58e58a'};
const EL_LABEL = {SCISSORS:'✂️ Kéo',ROCK:'🔨 Búa',PAPER:'📄 Bao'};
const n1 = x => Number(x).toFixed(1);
const n2 = x => Number(x).toFixed(2);

function updateStatPreviews() {
    const aEl = document.getElementById('pet-a-el').value;
    const bEl = document.getElementById('pet-b-el').value;
    const aLv = parseInt(document.getElementById('pet-a-lv').value) || 1;
    const bLv = parseInt(document.getElementById('pet-b-lv').value) || 1;

    const sa = statsAtLv(aEl, aLv), sb = statsAtLv(bEl, bLv);
    // Lấy stats sau khi áp dụng khắc chế/cùng hệ
    const inCombat = prepareFight(sa, sb);
    const ca = inCombat.A, cb = inCombat.B;

    function render(id, el, s, c, vsEl) {
        const drRaw = drRate(s.def), pcRaw = passiveChance(s.luck);
        const drIn = drRate(c.def), pcIn = passiveChance(c.luck);
        const changed = (c.hp !== s.hp || c.atk !== s.atk || c.def !== s.def || c.luck !== s.luck || c.dmgMult !== 1);

        document.getElementById(id).innerHTML = `
            <div><strong style="color:${EL_COLOR[el]}">${EL_LABEL[el]}</strong> Lv.${s.level} — vs ${EL_LABEL[vsEl]}</div>
            <div class="row" style="margin-top:6px;">
                <div class="item"><span style="color:var(--muted)">HP</span><br><span class="val" style="color:${EL_COLOR[el]}"><span style="font-size:10px;color:var(--muted)">gốc</span> ${n1(s.hp)}</span></div>
                <div class="item"><span style="color:var(--muted)">ATK</span><br><span class="val" style="color:${EL_COLOR[el]}"><span style="font-size:10px;color:var(--muted)">gốc</span> ${n1(s.atk)}</span></div>
                <div class="item"><span style="color:var(--muted)">DEF</span><br><span class="val" style="color:${EL_COLOR[el]}"><span style="font-size:10px;color:var(--muted)">gốc</span> ${n1(s.def)}</span></div>
                <div class="item"><span style="color:var(--muted)">LUCK</span><br><span class="val" style="color:${EL_COLOR[el]}"><span style="font-size:10px;color:var(--muted)">gốc</span> ${n1(s.luck)}</span></div>
                <div class="item"><span style="color:var(--muted)">DR%</span><br><span>${n1(drRaw*100)}%</span></div>
                <div class="item"><span style="color:var(--muted)">Nội tại%</span><br><span>${n1(pcRaw*100)}%</span></div>
            </div>`
            + (changed ? `
            <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);color:var(--accent);font-size:10px;font-weight:600;letter-spacing:0.5px;">
                ⚡ SAU KHẮC CHẾ/CÙNG HỆ (trong trận):
            </div>
            <div class="row" style="margin-top:4px;">
                <div class="item"><span style="color:var(--muted)">HP</span><br><span class="val" style="color:${c.hp !== s.hp ? 'var(--accent)' : EL_COLOR[el]}">${n1(c.hp)}</span></div>
                <div class="item"><span style="color:var(--muted)">ATK</span><br><span class="val" style="color:${c.atk !== s.atk ? 'var(--accent)' : EL_COLOR[el]}">${n1(c.atk)}${c.dmgMult !== 1 ? '<span style="font-size:9px;color:var(--accent);"> ×' + n2(c.dmgMult) + '</span>' : ''}</span></div>
                <div class="item"><span style="color:var(--muted)">DEF</span><br><span class="val" style="color:${c.def !== s.def ? 'var(--accent)' : EL_COLOR[el]}">${n1(c.def)}</span></div>
                <div class="item"><span style="color:var(--muted)">LUCK</span><br><span class="val" style="color:${c.luck !== s.luck ? 'var(--accent)' : EL_COLOR[el]}">${n1(c.luck)}</span></div>
                <div class="item"><span style="color:var(--muted)">DR%</span><br><span>${n1(drIn*100)}%</span></div>
                <div class="item"><span style="color:var(--muted)">Nội tại%</span><br><span>${n1(pcIn*100)}%</span></div>
            </div>` : `
            <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);color:var(--muted);font-size:10px;">⚡ Trong trận: không thay đổi (không có khắc chế/cùng hệ)</div>`);
    }
    render('stat-a', aEl, sa, ca, bEl);
    render('stat-b', bEl, sb, cb, aEl);
}

document.getElementById('pet-a-el').addEventListener('change', updateStatPreviews);
document.getElementById('pet-b-el').addEventListener('change', updateStatPreviews);
document.getElementById('pet-a-lv').addEventListener('input', updateStatPreviews);
document.getElementById('pet-b-lv').addEventListener('input', updateStatPreviews);

updateStatPreviews();

// ── RUN TEST ──
function runTest() {
    const aEl = document.getElementById('pet-a-el').value;
    const bEl = document.getElementById('pet-b-el').value;
    const aLv = Math.max(1, Math.min(40, parseInt(document.getElementById('pet-a-lv').value) || 1));
    const bLv = Math.max(1, Math.min(40, parseInt(document.getElementById('pet-b-lv').value) || 1));
    const n = Math.max(10, Math.min(10000, parseInt(document.getElementById('sim-n').value) || 500));

    document.getElementById('pet-a-lv').value = aLv;
    document.getElementById('pet-b-lv').value = bLv;
    document.getElementById('sim-n').value = n;

    const btn = document.getElementById('btn-run');
    btn.disabled = true; btn.textContent = '⏳ Đang chạy...';
    document.getElementById('progress').textContent = '';

    const sa = statsAtLv(aEl, aLv), sb = statsAtLv(bEl, bLv);
    let winA = 0, winB = 0, draw = 0, totalTurns = 0;
    let sumHpA = 0, sumHpB = 0;
    let minT = Infinity, maxT = 0;
    const hpA = [], hpB = [];

    const batchSize = Math.max(1, Math.floor(n / 15));

    function runBatch(start) {
        const end = Math.min(start + batchSize, n);
        for (let i = start; i < end; i++) {
            const gf = (i % 2 === 0) ? 'A' : 'B';
            const r = simulateBattle(sa, sb, gf);
            totalTurns += r.turns;
            if (r.turns < minT) minT = r.turns;
            if (r.turns > maxT) maxT = r.turns;
            if (r.winner === 'A') { winA++; sumHpA += r.winnerHpRatio; hpA.push(r.winnerHpRatio * 100); }
            else if (r.winner === 'B') { winB++; sumHpB += r.winnerHpRatio; hpB.push(r.winnerHpRatio * 100); }
            else { draw++; }
        }
        if (end < n) {
            document.getElementById('progress').textContent = `Đã chạy ${end}/${n} trận...`;
            setTimeout(() => runBatch(end), 0);
        } else {
            displayResults();
        }
    }

    function displayResults() {
        btn.disabled = false; btn.textContent = '▶ Chạy mô phỏng';
        document.getElementById('progress').textContent = `Hoàn tất ${n} trận`;

        const avgT = totalTurns / n;
        const wrA = winA / n * 100, wrB = winB / n * 100;
        const avgHpA = winA > 0 ? sumHpA / winA * 100 : 0;
        const avgHpB = winB > 0 ? sumHpB / winB * 100 : 0;

        function p(arr, pct) {
            if (!arr.length) return 0;
            const s = [...arr].sort((a, b) => a - b);
            return s[Math.floor(s.length * pct / 100)] || 0;
        }

        // Counter hint
        const counterMap = { ROCK: 'SCISSORS', SCISSORS: 'PAPER', PAPER: 'ROCK' };
        let counterHint = '';
        if (counterMap[aEl] === bEl) {
            counterHint = `<span style="background:rgba(74,222,128,0.15);color:var(--ok);padding:2px 8px;border-radius:10px;">${EL_LABEL[aEl]} khắc ${EL_LABEL[bEl]}</span>`;
        } else if (counterMap[bEl] === aEl) {
            counterHint = `<span style="background:rgba(255,107,53,0.15);color:var(--warn);padding:2px 8px;border-radius:10px;">${EL_LABEL[bEl]} khắc ${EL_LABEL[aEl]}</span>`;
        } else if (aEl === bEl) {
            counterHint = '<span style="background:rgba(192,132,252,0.15);color:#c084fc;padding:2px 8px;border-radius:10px;">Mirror (cùng hệ)</span>';
        }

        const combinedHp = (avgHpA * winA + avgHpB * winB) / (winA + winB || 1);

        document.getElementById('sec-res').style.display = 'block';
        document.getElementById('result-grid').innerHTML = `
            <div class="result-card">
                <div class="label">${EL_LABEL[aEl]} thắng</div>
                <div class="value" style="color:${EL_COLOR[aEl]}">${n1(wrA)}%</div>
                <div class="sub">${winA}/${n} trận</div>
            </div>
            <div class="result-card">
                <div class="label">${EL_LABEL[bEl]} thắng</div>
                <div class="value" style="color:${EL_COLOR[bEl]}">${n1(wrB)}%</div>
                <div class="sub">${winB}/${n} trận</div>
            </div>
            <div class="result-card">
                <div class="label">Số lượt TB</div>
                <div class="value">${n1(avgT)}</div>
                <div class="sub">${minT} - ${maxT} lượt</div>
            </div>
            <div class="result-card">
                <div class="label">HP còn lại TB</div>
                <div class="value">${n1(combinedHp)}%</div>
                <div class="sub">${counterHint || 'Cặp trung tính'}</div>
            </div>`;

        document.getElementById('detail-table').innerHTML = `
            <div style="margin-top:12px;color:var(--muted);font-size:11px;">📊 Chi tiết phân phối</div>
            <table class="detail-table">
                <thead><tr>
                    <th>Chỉ số</th><th>${EL_LABEL[aEl]} (Pet A)</th><th>${EL_LABEL[bEl]} (Pet B)</th>
                </tr></thead>
                <tbody>
                    <tr><td>Tỉ lệ thắng</td><td style="color:${EL_COLOR[aEl]};font-weight:700;">${n1(wrA)}%</td><td style="color:${EL_COLOR[bEl]};font-weight:700;">${n1(wrB)}%</td></tr>
                    <tr><td>HP TB khi thắng</td><td>${n1(avgHpA)}%</td><td>${n1(avgHpB)}%</td></tr>
                    <tr><td>HP P25 (25% percentile)</td><td>${n1(p(hpA, 25))}%</td><td>${n1(p(hpB, 25))}%</td></tr>
                    <tr><td>HP P50 — trung vị</td><td>${n1(p(hpA, 50))}%</td><td>${n1(p(hpB, 50))}%</td></tr>
                    <tr><td>HP P75 (75% percentile)</td><td>${n1(p(hpA, 75))}%</td><td>${n1(p(hpB, 75))}%</td></tr>
                    <tr><td>HP Min</td><td>${n1(hpA.length ? Math.min(...hpA) : 0)}%</td><td>${n1(hpB.length ? Math.min(...hpB) : 0)}%</td></tr>
                    <tr><td>HP Max</td><td>${n1(hpA.length ? Math.max(...hpA) : 0)}%</td><td>${n1(hpB.length ? Math.max(...hpB) : 0)}%</td></tr>
                    <tr><td>Số lượt TB</td><td colspan="2" style="text-align:center;">${n1(avgT)} (min ${minT} / max ${maxT})</td></tr>
                    <tr><td>Hòa</td><td colspan="2" style="text-align:center;">${(draw/n*100).toFixed(2)}%</td></tr>
                </tbody>
            </table>`;
    }

    runBatch(0);
}
</script>
